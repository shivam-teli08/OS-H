<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OS-H Onboarding</title>
</head>
<body>

<div class="container">
    <h2>Welcome to OS-H 👋</h2>

    <form action="/save-onboarding" method="POST">
        <!-- Skill Level -->
        <label>Skill Level</label>
        <select name="skill_level" required>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <!-- Languages -->
        <label>Languages</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="languages" value="Python"> Python</label><br>
            <label><input type="checkbox" name="languages" value="JavaScript"> JavaScript</label><br>
            <label><input type="checkbox" name="languages" value="Go"> Go</label><br>
            <label><input type="checkbox" name="languages" value="Java"> Java</label><br>
        </div>

        <!-- Interests -->
        <label>Interests</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="interests" value="Backend"> Backend</label><br>
            <label><input type="checkbox" name="interests" value="Frontend"> Frontend</label><br>
            <label><input type="checkbox" name="interests" value="DevOps"> DevOps</label><br>
            <label><input type="checkbox" name="interests" value="AI/ML"> AI/ML</label><br>
        </div>

        <!-- Goal -->
        <label>Contribution Goal</label>
        <select name="goal">
            <option value="first_contribution">First Contribution</option>
            <option value="portfolio">Build Portfolio</option>
            <option value="hacktoberfest">Hacktoberfest</option>
        </select>

        <button type="submit">Continue</button>
    </form>
</div>

</body>
</html>
