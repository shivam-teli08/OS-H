<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding | OS-H</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="shell">
    <header class="topbar">
        <a class="brand" href="{{ url_for('indexRoute.index') }}">
            <span class="brand-mark">OS</span>
            <span>OS-H</span>
        </a>
    </header>

    <main class="form-page">
        <div class="page-head">
            <div>
                <span class="eyebrow">Contributor setup</span>
                <h1 style="margin: 1rem 0 0.25rem;">Set up your contributor profile.</h1>
                <p class="lead">These fields match the onboarding data your backend already saves.</p>
            </div>
        </div>

        <form class="card panel grid" action="/save-onboarding" method="POST">
            <div class="field">
                <label for="experience_level">Experience Level</label>
                <select id="experience_level" name="experience_level" required>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="field">
                <label>Programming Languages</label>
                <p class="lead" style="margin: 0.25rem 0 0.75rem;">Pick the languages you are most comfortable with.</p>
                <div class="checks">
                    <label class="check"><input type="checkbox" name="languages" value="Python"> Python</label>
                    <label class="check"><input type="checkbox" name="languages" value="Java"> Java</label>
                    <label class="check"><input type="checkbox" name="languages" value="JavaScript"> JavaScript</label>
                    <label class="check"><input type="checkbox" name="languages" value="TypeScript"> TypeScript</label>
                    <label class="check"><input type="checkbox" name="languages" value="Go"> Go</label>
                    <label class="check"><input type="checkbox" name="languages" value="Rust"> Rust</label>
                    <label class="check"><input type="checkbox" name="languages" value="C++"> C++</label>
                    <label class="check"><input type="checkbox" name="languages" value="C#"> C#</label>
                    <label class="check"><input type="checkbox" name="languages" value="PHP"> PHP</label>
                </div>
            </div>

            <div class="field">
                <label>Frameworks</label>
                <p class="lead" style="margin: 0.25rem 0 0.75rem;">Choose a few frameworks you use or want to explore.</p>
                <div class="checks">
                    <label class="check"><input type="checkbox" name="frameworks" value="Django"> Django</label>
                    <label class="check"><input type="checkbox" name="frameworks" value="Flask"> Flask</label>
                    <label class="check"><input type="checkbox" name="frameworks" value="FastAPI"> FastAPI</label>
                    <label class="check"><input type="checkbox" name="frameworks" value="React"> React</label>
                    <label class="check"><input type="checkbox" name="frameworks" value="Next.js"> Next.js</label>
                    <label class="check"><input type="checkbox" name="frameworks" value="Node.js"> Node.js</label>
                    <label class="check"><input type="checkbox" name="frameworks" value="Spring Boot"> Spring Boot</label>
                    <label class="check"><input type="checkbox" name="frameworks" value=".NET"> .NET</label>
                </div>
            </div>

            <div class="field">
                <label>Domains / Interests</label>
                <p class="lead" style="margin: 0.25rem 0 0.75rem;">Choose the areas you are interested in exploring.</p>
                <div class="checks">
                    <label class="check"><input type="checkbox" name="interests" value="Backend"> Backend</label>
                    <label class="check"><input type="checkbox" name="interests" value="Frontend"> Frontend</label>
                    <label class="check"><input type="checkbox" name="interests" value="Mobile"> Mobile</label>
                    <label class="check"><input type="checkbox" name="interests" value="DevOps"> DevOps</label>
                    <label class="check"><input type="checkbox" name="interests" value="AI/ML"> AI/ML</label>
                    <label class="check"><input type="checkbox" name="interests" value="Data Science"> Data Science</label>
                    <label class="check"><input type="checkbox" name="interests" value="Cybersecurity"> Cybersecurity</label>
                    <label class="check"><input type="checkbox" name="interests" value="Cloud"> Cloud</label>
                    <label class="check"><input type="checkbox" name="interests" value="Game Development"> Game Development</label>
                    <label class="check"><input type="checkbox" name="interests" value="Web3"> Web3</label>
                    <label class="check"><input type="checkbox" name="interests" value="Open Source Tooling"> Open Source Tooling</label>
                </div>
            </div>

            <div class="field">
                <label for="weekly_availability">Weekly Availability</label>
                <select id="weekly_availability" name="weekly_availability" required>
                    <option value="1-3 hrs/week">1-3 hrs/week</option>
                    <option value="4-8 hrs/week">4-8 hrs/week</option>
                    <option value="9+ hrs/week">9+ hrs/week</option>
                </select>
            </div>

            <div class="field">
                <label for="goal">Goal</label>
                <select id="goal" name="goal">
                    <option value="first_contribution">First Contribution</option>
                    <option value="build_portfolio">Build Portfolio</option>
                    <option value="learn_new_technology">Learn New Technology</option>
                    <option value="hacktoberfest">Hacktoberfest</option>
                    <option value="fix_bugs">Fix Bugs</option>
                    <option value="documentation">Documentation</option>
                    <option value="feature_development">Feature Development</option>
                </select>
            </div>

            <div class="actions">
                <button class="btn primary" type="submit">Continue to dashboard</button>
            </div>
        </form>
    </main>
</body>
</html>
